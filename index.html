<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>UCKAM Lingo AI - Final</title>
    <style>
        body { background-color: #121212; margin: 0; padding: 5px; font-family: 'Malgun Gothic', sans-serif; height: 98vh; overflow: hidden; display: flex; flex-direction: column; color: white; }
        .admin-panel { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; background: rgba(0,0,0,0.9); padding: 12px; z-index: 1000; justify-content: center; border-bottom: 2px solid #4285F4; align-items: center; }
        .container { display: flex; flex-direction: column; gap: 5px; padding-top: 120px; flex: 1; overflow: hidden; }
        .ko-box, .sub-box { background: rgba(0,0,0,0.65); border-left: 5px solid #00FFCC; padding: 6px 15px; border-radius: 0 10px 10px 0; }
        .sub-box { border-left-color: #4285F4; min-height: 85px; display: flex; flex-direction: column; justify-content: flex-end; }
        .lang-label { color: #FFD700; font-size: 0.85rem; font-weight: bold; margin-bottom: 2px; }
        .ko-text { color: #00FFCC; font-size: 1.1rem; font-weight: bold; }
        .line { color: white; font-size: 1.3rem; font-weight: bold; text-shadow: 2px 2px 4px #000; margin: 1px 0; }
        .history-section { display: flex; gap: 8px; margin-top: 5px; background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 12px; flex: 1; overflow: hidden; }
        .hist-col { flex: 1; overflow-y: auto; font-size: 0.82rem; color: #eee; background: rgba(0, 0, 0, 0.5); padding: 10px; border-radius: 8px; }
        #start-btn { background: #4285F4; color: white; border: none; padding: 8px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-running { background: #ff4444 !important; }
    </style>
</head>
<body onclick="initAudio()"> <div id="setup" class="admin-panel">
    <div style="color: #ff4444; font-size: 11px; font-weight: bold;">[소리가 안 나면 화면 클릭!]</div>
    <div class="ch-set"> 1번 <select id="l1"></select> <input type="checkbox" id="v1" checked> </div>
    <div class="ch-set"> 2번 <select id="l2"></select> <input type="checkbox" id="v2" checked> </div>
    <div class="ch-set"> 3번 <select id="l3"></select> <input type="checkbox" id="v3" checked> </div>
    <button id="start-btn">🎙️ 방송 시작</button>
</div>

<div class="container">
    <div class="lang-label">● KOREAN (LIVE)</div>
    <div class="ko-box"><div id="ko-text" class="ko-text">화면을 클릭한 후 방송 시작을 눌러주세요.</div></div>
    <div class="lang-label" id="label1"></div><div id="box1" class="sub-box"></div>
    <div class="lang-label" id="label2"></div><div id="box2" class="sub-box"></div>
    <div class="lang-label" id="label3"></div><div id="box3" class="sub-box"></div>
    <div class="history-section">
        <div class="hist-col" id="hlist1"></div>
        <div class="hist-col" id="hlist2"></div>
        <div class="hist-col" id="hlist3"></div>
    </div>
</div>

<script>
    const countryList = { 'en-US': '🇺🇸 미국', 'ja-JP': '🇯🇵 일본', 'zh-TW': '🇹🇼 대만', 'en-SG': '🇸🇬 싱가포르', 'tl-PH': '🇵🇭 필리핀', 'vi-VN': '🇻🇳 베트남', 'th-TH': '🇹🇭 태국', 'id-ID': '🇮🇩 인도네시아' };
    const sortedKeys = Object.keys(countryList);
    [1, 2, 3].forEach(n => {
        const sel = document.getElementById(`l${n}`);
        sortedKeys.forEach(k => {
            const opt = document.createElement('option'); opt.value = k; opt.innerText = countryList[k]; sel.appendChild(opt);
        });
    });
    document.getElementById('l1').value = 'en-US'; document.getElementById('l2').value = 'ja-JP'; document.getElementById('l3').value = 'zh-TW';

    function updateLabels() { 
        for(let i=1; i<=3; i++) document.getElementById(`label${i}`).innerText = countryList[document.getElementById(`l${i}`).value];
    }
    updateLabels();
    document.querySelectorAll('select').forEach(s => s.onchange = updateLabels);

    // [중요] 오디오 엔진 강제 초기화
    function initAudio() {
        if (window.speechSynthesis.speaking) return;
        const ut = new SpeechSynthesisUtterance("");
        window.speechSynthesis.speak(ut); // 빈 소리를 한 번 내서 엔진을 깨움
        console.log("Audio Engine Ready");
    }

    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'ko-KR'; recognition.continuous = true; recognition.interimResults = true;
    let isStreaming = false;

    recognition.onresult = async (event) => {
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final = event.results[i][0].transcript.trim();
        }
        if (final) {
            document.getElementById('ko-text').innerText = final;
            for(let i=1; i<=3; i++) translate(final, document.getElementById(`l${i}`).value, i);
        }
    };

async function translate(text, lang, idx) {
        try {
            const tlCode = lang.split('-')[0];
            // 1. 번역 API
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${tlCode}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            const result = data[0][0][0];

            // 2. 화면 자막 업데이트
            const box = document.getElementById(`box${idx}`);
            const line = document.createElement('div'); line.className = 'line'; line.innerText = result;
            box.appendChild(line);
            if (box.children.length > 3) box.removeChild(box.firstChild);

            // 3. 로그 기록
            const hlist = document.getElementById(`hlist${idx}`);
            const hItem = document.createElement('div');
            hItem.style.borderBottom = "1px dotted #444";
            hItem.innerText = `[${new Date().toLocaleTimeString()}] ${result}`;
            hlist.prepend(hItem);

            // 4. 🔊 오직 구글 TTS만 사용 (백업 엔진 삭제)
            if (document.getElementById(`v${idx}`).checked) {
                // 구글 목소리 URL 생성 (랜덤값을 섞어 차단 방지)
                const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(result)}&tl=${tlCode}&client=tw-ob&nonce=${Math.random()}`;
                
                const audio = new Audio();
                audio.src = ttsUrl;
                audio.crossOrigin = "anonymous"; // 보안 허용 설정
                
                // 구글 목소리 재생
                audio.play().catch(e => {
                    console.log("구글 음성이 브라우저에 의해 차단됨. 자물쇠 설정을 확인하세요.");
                });
            }
        } catch (e) {
            console.error("번역 오류:", e);
        }
    }

    const btn = document.getElementById('start-btn');
    btn.onclick = () => {
        initAudio(); // 버튼 누를 때도 오디오 깨우기
        if(!isStreaming) { recognition.start(); isStreaming = true; btn.innerText = "🛑 방송 정지"; btn.classList.add('btn-running'); }
        else { recognition.stop(); isStreaming = false; btn.innerText = "🎙️ 방송 시작"; btn.classList.remove('btn-running'); }
    };
</script>
</body>
</html>
