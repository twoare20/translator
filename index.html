<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>UCKAM Lingo AI - Global Live</title>

<style>
body {
    background-color: #121212;
    margin: 0;
    padding: 5px;
    font-family: 'Malgun Gothic', sans-serif;
    height: 98vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: white;
}
.admin-panel {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    gap: 10px;
    background: rgba(0,0,0,0.9);
    padding: 12px;
    z-index: 1000;
    justify-content: center;
    border-bottom: 2px solid #4285F4;
}
.hidden { display: none !important; }
.ch-set {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #222;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
}
.voice-label {
    color: #00FFCC;
    font-weight: bold;
}
.container {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding-top: 120px;
    flex: 1;
    overflow: hidden;
}
.ko-box, .sub-box {
    background: rgba(0,0,0,0.65);
    border-left: 5px solid #00FFCC;
    padding: 6px 15px;
    border-radius: 0 10px 10px 0;
}
.sub-box { border-left-color: #4285F4; min-height: 80px; }
.lang-label {
    color: #FFD700;
    font-size: 0.85rem;
    font-weight: bold;
}
.ko-text { color: #00FFCC; font-size: 1.1rem; font-weight: bold; }
.line { font-size: 1.3rem; font-weight: bold; }
</style>
</head>

<body>

<div id="setup" class="admin-panel">
    <div class="ch-set">1번 <select id="l1"></select> <label class="voice-label"><input id="v1" type="checkbox" checked> 음성</label></div>
    <div class="ch-set">2번 <select id="l2"></select> <label class="voice-label"><input id="v2" type="checkbox" checked> 음성</label></div>
    <div class="ch-set">3번 <select id="l3"></select> <label class="voice-label"><input id="v3" type="checkbox" checked> 음성</label></div>
    <button id="start-btn">🎙️ 방송 시작</button>
</div>

<div class="container">
    <div class="lang-label">● KOREAN (LIVE)</div>
    <div class="ko-box"><div id="ko-text" class="ko-text">대기 중</div></div>

    <div class="lang-label" id="label1"></div>
    <div id="box1" class="sub-box"></div>

    <div class="lang-label" id="label2"></div>
    <div id="box2" class="sub-box"></div>

    <div class="lang-label" id="label3"></div>
    <div id="box3" class="sub-box"></div>
</div>

<script>
const countryList = {
    "en-SG": "🇸🇬 싱가포르 (영어)",
    "zh-TW": "🇹🇼 대만 (중국어)",
    "tl": "🇵🇭 필리핀 (타갈로그)",
    "ja": "🇯🇵 일본",
    "vi": "🇻🇳 베트남",
    "th": "🇹🇭 태국",
    "id": "🇮🇩 인도네시아"
};

[1,2,3].forEach(i=>{
    const sel=document.getElementById("l"+i);
    Object.keys(countryList).forEach(k=>{
        const o=document.createElement("option");
        o.value=k; o.textContent=countryList[k];
        sel.appendChild(o);
    });
});

l1.value="en-SG"; l2.value="zh-TW"; l3.value="tl";

function updateLabels(){
    [1,2,3].forEach(i=>{
        const k=document.getElementById("l"+i).value;
        document.getElementById("label"+i).innerText=countryList[k];
    });
}
updateLabels();
document.querySelectorAll("select").forEach(s=>s.onchange=updateLabels);

// 음성 인식
const recognition = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
recognition.lang="ko-KR";
recognition.continuous=true;
recognition.interimResults=true;

recognition.onresult = e => {
    let final="";
    for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final=e.results[i][0].transcript;
    }
    if(final){
        ko-text.innerText=final;
        [1,2,3].forEach(i=>{
            runTranslate(final, document.getElementById("l"+i).value, i);
        });
    }
};

async function runTranslate(text, lang, idx){
    const tl = lang.includes("-") ? lang.split("-")[0] : lang;
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
    const d = await r.json();
    const t = d[0][0][0];

    const box=document.getElementById("box"+idx);
    const div=document.createElement("div");
    div.className="line";
    div.innerText=t;
    box.innerHTML="";
    box.appendChild(div);

    if(document.getElementById("v"+idx).checked){
        fetch("http://127.0.0.1:8123/tts",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({ text:t, lang:lang })
        });
    }
}

start-btn.onclick=()=>{
    recognition.start();
    ko-text.innerText="말씀하세요";
};
</script>

</body>
</html>
