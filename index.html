<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>UCKAM Lingo AI - Global Live</title>
    <style>
        /* 기존 디자인 유지 */
        body { background-color: #121212; margin: 0; padding: 5px; font-family: 'Malgun Gothic', sans-serif; height: 98vh; overflow: hidden; display: flex; flex-direction: column; color: white; }
        .admin-panel { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; background: rgba(0,0,0,0.9); padding: 12px; z-index: 1000; justify-content: center; border-bottom: 2px solid #4285F4; align-items: center; }
        .container { display: flex; flex-direction: column; gap: 5px; padding-top: 120px; flex: 1; overflow: hidden; }
        .ko-box, .sub-box { background: rgba(0,0,0,0.65); border-left: 5px solid #00FFCC; padding: 6px 15px; border-radius: 0 10px 10px 0; }
        .sub-box { border-left-color: #4285F4; min-height: 85px; display: flex; flex-direction: column; justify-content: flex-end; }
        .lang-label { color: #FFD700; font-size: 0.85rem; font-weight: bold; margin-bottom: 2px; }
        .line { color: white; font-size: 1.3rem; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        .history-section { display: flex; gap: 8px; margin-top: 5px; background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 12px; flex: 1; overflow: hidden; }
        .hist-col { flex: 1; overflow-y: auto; font-size: 0.82rem; color: #eee; padding: 10px; background: rgba(0, 0, 0, 0.5); border-radius: 8px; }
        
        /* [핵심] 영상 인트로 레이어 디자인 */
        #video-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #intro-video {
            max-width: 900px; width: 85%; border-radius: 20px;
            box-shadow: 0 0 50px rgba(66, 133, 244, 0.3);
        }
        #start-system-btn {
            margin-top: 30px; padding: 18px 60px; font-size: 22px; font-weight: bold;
            color: white; background: linear-gradient(45deg, #4285F4, #34A853);
            border: none; border-radius: 50px; cursor: pointer;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        #start-system-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        
        #start-btn { background: #4285F4; color: white; border: none; padding: 8px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-running { background: #ff4444 !important; }
        select { background: #333; color: white; border: 1px solid #555; padding: 3px; border-radius: 4px; }
    </style>
</head>
<body>

<div id="video-layer">
    <video id="intro-video" autoplay muted loop>
        <source src="intro.mp4" type="video/mp4">
        영상을 지원하지 않는 환경입니다.
    </video>
    <button id="start-system-btn" onclick="unlockEverything()">🚀 시스템 시작 (소리 활성화)</button>
    <p style="color: #666; margin-top: 15px;">보안 정책상 클릭 한 번이 필요합니다.</p>
</div>

<div id="setup" class="admin-panel">
    <div style="display:flex; gap:10px;">
        <select id="l1"></select> <input type="checkbox" id="v1" checked>
        <select id="l2"></select> <input type="checkbox" id="v2" checked>
        <select id="l3"></select> <input type="checkbox" id="v3" checked>
    </div>
    <button id="start-btn">🎙️ 방송 시작</button>
</div>

<div class="container">
    <div class="lang-label">● KOREAN (LIVE)</div>
    <div class="ko-box"><div id="ko-text" style="color:#00FFCC; font-weight:bold;">시스템이 준비되었습니다.</div></div>
    <div id="label1" class="lang-label"></div><div id="box1" class="sub-box"></div>
    <div id="label2" class="lang-label"></div><div id="box2" class="sub-box"></div>
    <div id="label3" class="lang-label"></div><div id="box3" class="sub-box"></div>
    <div class="history-section">
        <div class="hist-col"><div id="hlist1"></div></div>
        <div class="hist-col"><div id="hlist2"></div></div>
        <div class="hist-col"><div id="hlist3"></div></div>
    </div>
</div>

<script>
    // 🔊 [가장 중요] 소리 잠금을 해제하는 함수
    function unlockEverything() {
        const audio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        audio.play().then(() => {
            document.getElementById('video-layer').style.display = 'none';
            document.getElementById('intro-video').pause();
            console.log("Edge Audio Unlocked!");
        });
    }

    const countryList = { 'en-SG': '🇸🇬 싱가포르', 'zh-TW': '🇹🇼 대만', 'tl': '🇵🇭 필리핀', 'en': '🇺🇸 미국', 'ja': '🇯🇵 일본', 'vi': '🇻🇳 베트남', 'th': '🇹🇭 태국', 'id': '🇮🇩 인도네시아' };
    [1,2,3].forEach(n=>{
        const s=document.getElementById(`l${n}`);
        Object.keys(countryList).forEach(k=>{
            const o=document.createElement('option'); o.value=k; o.innerText=countryList[k]; s.appendChild(o);
        });
    });

    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'ko-KR'; recognition.continuous = true; recognition.interimResults = true;
    let isRunning = false;

    recognition.onresult = async (event) => {
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final = event.results[i][0].transcript.trim();
        }
        if (final) {
            document.getElementById('ko-text').innerText = final;
            for(let i=1; i<=3; i++) {
                const tl = document.getElementById(`l${i}`).value;
                translateAndSpeak(final, tl, i);
            }
        }
    };

    async function translateAndSpeak(text, tl, idx) {
        try {
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            const result = data[0][0][0];

            document.getElementById(`box${idx}`).innerHTML = `<div class="line">${result}</div>`;
            const h = document.getElementById(`hlist${idx}`);
            const item = document.createElement('div');
            item.innerHTML = `<p style="border-bottom:1px solid #333; padding:5px;">${result}<br><span style="color:#666; font-size:11px;">(${text})</span></p>`;
            h.prepend(item);

            if (document.getElementById(`v${idx}`).checked) {
                const s = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(result)}&tl=${tl}&client=tw-ob`);
                s.play();
            }
        } catch(e) {}
    }

    const btn = document.getElementById('start-btn');
    btn.onclick = () => {
        if(!isRunning) { recognition.start(); isRunning=true; btn.innerText="🛑 정지"; btn.classList.add('btn-running'); }
        else { recognition.stop(); isRunning=false; btn.innerText="🎙️ 방송 시작"; btn.classList.remove('btn-running'); }
    };
    recognition.onend = () => { if(isRunning) recognition.start(); };
</script>
</body>
</html>
