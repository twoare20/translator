<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>UCKAM Lingo AI - Global Live</title>

<style>
body {
    background:#121212;
    margin:0;
    padding:5px;
    font-family:'Malgun Gothic', sans-serif;
    height:98vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    color:white;
}

.admin-panel{
    position:fixed; top:0; left:0; right:0;
    display:flex; gap:10px;
    background:rgba(0,0,0,0.9);
    padding:12px;
    z-index:1000;
    justify-content:center;
    border-bottom:2px solid #4285F4;
    align-items:center;
}

.hidden{ display:none !important; }

.ch-set{
    display:flex; align-items:center; gap:6px;
    background:#222; padding:6px 12px;
    border-radius:8px;
    font-size:12px;
    border:1px solid #444;
}

.voice-label{
    display:flex; align-items:center; gap:3px;
    cursor:pointer;
    color:#00FFCC;
    font-weight:bold;
}

.container{
    display:flex;
    flex-direction:column;
    gap:5px;
    padding-top:120px;
    flex:1;
    overflow:hidden;
}

.ko-box,.sub-box{
    background:rgba(0,0,0,0.65);
    border-left:5px solid #00FFCC;
    padding:6px 15px;
    border-radius:0 10px 10px 0;
}

.sub-box{
    border-left-color:#4285F4;
    min-height:85px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
}

.lang-label{
    color:#FFD700;
    font-size:0.85rem;
    font-weight:bold;
}

.ko-text{
    color:#00FFCC;
    font-size:1.1rem;
    font-weight:bold;
}

.line{
    font-size:1.3rem;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
    line-height:1.1;
}

#start-btn{
    background:#4285F4;
    color:white;
    border:none;
    padding:8px 25px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.btn-running{ background:#ff4444 !important; }

select{
    background:#333;
    color:white;
    border:1px solid #555;
    width:160px;
    font-size:12px;
    padding:3px;
    border-radius:4px;
}
</style>
</head>

<body>

<div id="setup" class="admin-panel">
    <div class="ch-set">1번 국가
        <select id="l1"></select>
        <label class="voice-label">
            <input type="checkbox" id="v1" checked> 음성
        </label>
    </div>

    <div class="ch-set">2번 국가
        <select id="l2"></select>
        <label class="voice-label">
            <input type="checkbox" id="v2" checked> 음성
        </label>
    </div>

    <div class="ch-set">3번 국가
        <select id="l3"></select>
        <label class="voice-label">
            <input type="checkbox" id="v3" checked> 음성
        </label>
    </div>

    <button id="start-btn">🎙️ 방송 시작</button>
</div>

<div class="container">
    <div class="lang-label">● KOREAN (LIVE)</div>
    <div class="ko-box"><div id="ko-text" class="ko-text">버튼을 누르면 시작됩니다.</div></div>

    <div class="lang-label" id="label1"></div><div id="box1" class="sub-box"></div>
    <div class="lang-label" id="label2"></div><div id="box2" class="sub-box"></div>
    <div class="lang-label" id="label3"></div><div id="box3" class="sub-box"></div>
</div>

<script>
const countryList = {
    "en":"🇺🇸 미국 (영어)",
    "ja":"🇯🇵 일본",
    "zh":"🇨🇳 중국",
    "vi":"🇻🇳 베트남",
    "th":"🇹🇭 태국",
    "id":"🇮🇩 인도네시아"
};

[1,2,3].forEach(i=>{
    const sel=document.getElementById("l"+i);
    Object.keys(countryList).forEach(k=>{
        const o=document.createElement("option");
        o.value=k; o.innerText=countryList[k];
        sel.appendChild(o);
    });
});

document.getElementById("l1").value="en";
document.getElementById("l2").value="ja";
document.getElementById("l3").value="zh";

function updateLabels(){
    [1,2,3].forEach(i=>{
        const k=document.getElementById("l"+i).value;
        document.getElementById("label"+i).innerText=countryList[k];
    });
}
updateLabels();
document.querySelectorAll("select").forEach(s=>s.onchange=updateLabels);

// 음성 인식
const rec = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang="ko-KR";
rec.continuous=true;
rec.interimResults=true;

let running=false;

rec.onresult=e=>{
    let final="";
    for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final=e.results[i][0].transcript.trim();
    }
    if(final){
        document.getElementById("ko-text").innerText=final;
        [1,2,3].forEach(i=>translate(final,i));
    }
};

function translate(text,idx){
    const lang=document.getElementById("l"+idx).value;
    fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${lang}&dt=t&q=${encodeURIComponent(text)}`)
    .then(r=>r.json())
    .then(d=>{
        const t=d[0][0][0];
        const box=document.getElementById("box"+idx);
        const div=document.createElement("div");
        div.className="line";
        div.innerText=t;
        box.appendChild(div);
        if(box.children.length>3) box.removeChild(box.firstChild);

        // 🔊 Python TTS 호출
        if(document.getElementById("v"+idx).checked){
            fetch("http://127.0.0.1:8123/tts",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({text:t,lang:lang})
            });
        }
    });
}

document.getElementById("start-btn").onclick=()=>{
    if(!running){
        running=true;
        rec.start();
        document.getElementById("start-btn").innerText="🛑 방송 정지";
        document.getElementById("ko-text").innerText="가동 중...";
    }else{
        running=false;
        rec.stop();
        document.getElementById("start-btn").innerText="🎙️ 방송 시작";
        document.getElementById("ko-text").innerText="중지됨";
    }
};

window.addEventListener("keydown",e=>{
    if(e.key==="h") document.getElementById("setup").classList.toggle("hidden");
});
</script>

</body>
</html>
