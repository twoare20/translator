<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>UCKAM Global Live</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 10px; height: 98vh; display: flex; flex-direction: column; overflow: hidden; }
        .admin-panel { display: flex; gap: 10px; background: #222; padding: 15px; border-radius: 10px; justify-content: center; align-items: center; border-bottom: 3px solid #4285F4; margin-bottom: 15px; }
        .ch-set { background: #333; padding: 8px 12px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .container { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-bottom: 50px; }
        .ko-box, .sub-box { background: rgba(255,255,255,0.05); border-left: 5px solid #00FFCC; padding: 15px; border-radius: 0 10px 10px 0; min-height: 60px; }
        .sub-box { border-left-color: #4285F4; }
        .lang-label { color: #FFD700; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .line { font-size: 1.5rem; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #start-btn { background: #4285F4; color: white; border: none; padding: 10px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-running { background: #ff4444 !important; }
    </style>
</head>
<body onclick="const a=new Audio(); a.play().catch(()=>{});">

<div class="admin-panel">
    <div class="ch-set">1번 <select id="l1"></select> <input type="checkbox" id="v1" checked></div>
    <div class="ch-set">2번 <select id="l2"></select> <input type="checkbox" id="v2" checked></div>
    <div class="ch-set">3번 <select id="l3"></select> <input type="checkbox" id="v3" checked></div>
    <button id="start-btn">🎙️ 방송 시작</button>
</div>

<div class="container">
    <div class="lang-label">● KOREAN (LIVE)</div>
    <div class="ko-box"><div id="ko-text" style="color:#00FFCC; font-weight:bold;">화면 클릭 -> 방송 시작 클릭</div></div>
    <div id="results-area"></div> </div>

<script>
    const countries = { 'en-US': '🇺🇸 미국', 'ja-JP': '🇯🇵 일본', 'zh-TW': '🇹🇼 대만', 'en-SG': '🇸🇬 싱가포르', 'tl-PH': '🇵🇭 필리핀', 'vi-VN': '🇻🇳 베트남', 'th-TH': '🇹🇭 태국', 'id-ID': '🇮🇩 인도네시아' };
    [1, 2, 3].forEach(n => {
        const sel = document.getElementById(`l${n}`);
        Object.entries(countries).forEach(([code, name]) => {
            const opt = document.createElement('option'); opt.value = code; opt.innerText = name; sel.appendChild(opt);
        });
    });
    document.getElementById('l1').value = 'en-US'; document.getElementById('l2').value = 'ja-JP'; document.getElementById('l3').value = 'zh-TW';

    const recognition = new (window.webkitSpeechRecognition || window.SpeechRecognition)();
    recognition.lang = 'ko-KR'; recognition.continuous = true; recognition.interimResults = true;
    let isRunning = false;

    recognition.onresult = async (event) => {
        let final = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) final = event.results[i][0].transcript.trim();
        }
        if (final) {
            document.getElementById('ko-text').innerText = final;
            // 1, 2, 3번 번역을 동시에 실행
            [1, 2, 3].forEach(i => handleTranslate(final, document.getElementById(`l${i}`).value, i));
        }
    };

    async function handleTranslate(text, lang, idx) {
        try {
            const tl = lang.split('-')[0];
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);
            const data = await res.json();
            const result = data[0][0][0];

            // 1. 박스 생성 로직 (이미지가 비어있던 이유 해결)
            let box = document.getElementById(`res-box-${idx}`);
            if (!box) {
                const area = document.getElementById('results-area');
                const label = document.createElement('div'); label.className = 'lang-label'; label.innerText = countries[lang];
                box = document.createElement('div'); box.id = `res-box-${idx}`; box.className = 'sub-box';
                area.appendChild(label); area.appendChild(box);
            }
            box.innerHTML = `<div class="line">${result}</div>`;

            // 2. 구글 음성 출력
            if (document.getElementById(`v${idx}`).checked) {
                const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(result)}&tl=${tl}&client=tw-ob`;
                const audio = new Audio(ttsUrl);
                audio.play().catch(() => console.log("소리 재생 권한 필요"));
            }
        } catch (e) { console.error(e); }
    }

    const btn = document.getElementById('start-btn');
    btn.onclick = () => {
        if(!isRunning) { recognition.start(); isRunning = true; btn.innerText = "🛑 방송 정지"; btn.classList.add('btn-running'); }
        else { recognition.stop(); isRunning = false; btn.innerText = "🎙️ 방송 시작"; btn.classList.remove('btn-running'); }
    };
</script>
</body>
</html>
